name: Laravel CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Instalar Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copiar .env
        run: cp .env.example .env

      - name: Generar APP_KEY
        run: |
          if php artisan list --raw | grep -q '^key:generate$'; then
            php artisan key:generate --ansi --force
          else
            php -r '$key = "base64:".base64_encode(random_bytes(32)); $env = file_get_contents(".env"); $env = preg_replace("/^APP_KEY=.*$/m","APP_KEY=".$key,$env); file_put_contents(".env",$env); echo $key."\n";'
          fi

      - name: Ejecutar pruebas
        run: php artisan test
